*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fh);font-weight:500;letter-spacing:.005em;margin:0;line-height:1.1}
label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
input,textarea,select{width:100%;font-family:inherit;font-size:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--g4);outline-offset:1px}
textarea{resize:vertical;min-height:64px}
button{font-family:var(--fh);cursor:pointer;border:none}
.btn{height:44px;padding:0 18px;border-radius:13px;font-size:14px;letter-spacing:.03em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:linear-gradient(150deg,#1B6B50,#0E3B2E);color:#fff;box-shadow:0 10px 20px -10px rgba(14,59,46,.55)}
.btn-primary:disabled{opacity:.55;cursor:default}
.btn-ghost{background:var(--paper);color:var(--g8);border:1px solid var(--line)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(178,59,59,.25)}
.btn-sm{height:34px;padding:0 12px;font-size:12px;border-radius:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.badge{height:22px;padding:0 9px;border-radius:7px;background:var(--g1);border:1px solid var(--g2);color:var(--g7);font-family:var(--fb);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center}
.err{color:var(--danger);background:var(--danger-bg);border:1px solid rgba(178,59,59,.25);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.msg{color:var(--g7);background:var(--g1);border:1px solid var(--g2);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
.spinner-dark{border-color:rgba(20,82,62,.25);border-top-color:var(--g7)}
@keyframes spin{to{transform:rotate(360deg)}}
.login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:360px;padding:32px 28px}
.file-drop{border:1.5px dashed var(--g3);border-radius:16px;padding:16px;text-align:center;cursor:pointer;background:var(--g1)}
.file-drop .preview-box{width:150px;max-width:100%;aspect-ratio:9/16;margin:0 auto;border-radius:14px;overflow:hidden;background:var(--g2);display:grid;place-items:center;border:1px solid var(--line)}
.file-drop .preview-box img{width:100%;height:100%;object-fit:cover;display:block}
.file-drop .hint{margin-top:10px;font-size:11.5px;color:var(--mut)}
.thumb-9x16{width:42px;height:74px;border-radius:10px;background:var(--g2) center/cover no-repeat;flex:none;border:1px solid var(--line)}

.shell{display:flex;min-height:100dvh}
.sidebar{width:230px;flex:none;background:linear-gradient(180deg,#0E3B2E 0%,#08251C 100%);color:#fff;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100dvh}

.sidebar .brand h1{font-size:16px;text-transform:uppercase;color:#fff}
.sidebar nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto}
.navitem{display:flex;align-items:center;gap:11px;padding:12px 12px;border-radius:13px;color:rgba(255,255,255,.68);font-family:var(--fb);font-size:13.5px;font-weight:700;cursor:pointer;transition:background .15s,color .15s}
.navitem:hover{background:rgba(255,255,255,.07);color:#fff}
.navitem.active{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(231,199,101,.28)}
.navitem svg{flex:none}
.sidebar .foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.sidebar .email{font-size:10.5px;color:rgba(255,255,255,.5);padding:0 8px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{flex:1;min-width:0}
.pagehead{display:flex;align-items:center;gap:14px;padding:22px 28px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.pagehead h2{font-size:21px;text-transform:uppercase}
.content{padding:24px 28px 90px;max-width:980px}
@media (max-width:800px){

  .sidebar .foot{margin-top:0;padding-top:0;border-top:none}
  .pagehead{padding:18px 18px}
  .content{padding:18px 18px 90px}
}

async function init(){
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_event, s)=>{ session = s; render(); });
  if(session){ await Promise.all([loadCategories(), loadItems(), loadAvatars()]); }
  render();
}

async function loadAvatars(){
  const { data, error } = await sb.from('avatars').select('*').order('sort_order',{ascending:true});
  if(error){ errorMsg = 'Аватарларды жүктеу қатесі: '+error.message; return; }
  avatars = data || [];
}

function selectTab(tab){
  activeTab = tab; editing = null; editingCategory = null; errorMsg=''; infoMsg='';

  render();
}

async function uploadAvatarFile(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  if(!file.type.startsWith('image/')){ errorMsg='Тек сурет файлын таңдаңыз.'; render(); return; }
  if(file.size > 4*1024*1024){ errorMsg='Файл тым үлкен (4 МБ дейін).'; render(); return; }
  avatarUploading = true; errorMsg=''; infoMsg=''; render();
  try{
    const ext = (file.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,'') || 'png';
    const path = 'avatar-'+(crypto.randomUUID?crypto.randomUUID():String(Date.now()))+'.'+ext;
    const { error: upErr } = await sb.storage.from('avatars').upload(path, file, { upsert:false, contentType: file.type });
    if(upErr) throw upErr;
    const { data: pub } = sb.storage.from('avatars').getPublicUrl(path);
    const { error: insErr } = await sb.from('avatars').insert({ image_url: pub.publicUrl, sort_order: avatars.length });
    if(insErr) throw insErr;
    avatarUploading = false;
    infoMsg = 'Аватар қосылды.';
    await loadAvatars();
    render();
  }catch(e){
    avatarUploading = false;
    errorMsg = 'Аватар қосу қатесі: '+(e.message||e);
    render();
  }
}

async function deleteAvatarById(id){
  if(!confirm('Бұл аватар үлгісін жоюды растайсыз ба?')) return;
  loading = true; render();
  const { error } = await sb.from('avatars').delete().eq('id', id);
  loading = false;

  infoMsg = 'Жойылды.';
  await loadAvatars();
  render();
}

async function loadCategories(){
  const { data, error } = await sb.from('categories').select('*').order('sort_order',{ascending:true});
  if(error){ errorMsg = 'Санаттарды жүктеу қатесі: '+error.message; return; }
  categories = data || [];
  if(activeCategoryId && !categories.some(c=>c.id===activeCategoryId)) activeCategoryId = null;
}

function categoryItemCount(catId){ return items.filter(m=>m.category_id===catId).length; }

}
function cancelEditCategory(){ editingCategory = null; render(); }

async function saveCategory(e){
  e.preventDefault();
  errorMsg=''; infoMsg='';
  const c = editingCategory;
  c.name_kz = document.getElementById('c_name_kz').value.trim();
  c.name_ru = document.getElementById('c_name_ru').value.trim() || c.name_kz;
  c.sort_order = parseInt(document.getElementById('c_sort').value,10) || 0;
  if(!c.name_kz){ errorMsg = 'Санат атауын (кемінде қазақша) толтырыңыз.'; render(); return; }
  loading = true; render();
  try{
    if(c.id){
      const { error } = await sb.from('categories').update({ name_kz:c.name_kz, name_ru:c.name_ru, sort_order:c.sort_order }).eq('id', c.id);
      if(error) throw error;
      infoMsg = 'Сақталды.';
    } else {
      const key = c.name_kz.toLowerCase().replace(/[^a-zа-яәғқңөұүһі0-9]+/gi,'-').replace(/^-+|-+$/g,'').slice(0,40) + '-' + Date.now().toString(36);
      const { error } = await sb.from('categories').insert({ key, name_kz:c.name_kz, name_ru:c.name_ru, sort_order:c.sort_order });
      if(error) throw error;
      infoMsg = 'Санат қосылды.';
    }
    editingCategory = null;
    loading = false;
    await loadCategories();
    render();
  }catch(err){
    loading = false;
    errorMsg = 'Сақтау қатесі: '+(err.message||err);
    render();
  }
}

async function deleteCategoryById(id){
  const c = categories.find(x=>x.id===id);
  if(!c) return;
  const n = categoryItemCount(id);
  if(n>0){ errorMsg = '«'+c.name_kz+'» санатында '+n+' сурет бар. Алдымен сол суреттерді басқа санатқа ауыстырыңыз немесе жойыңыз.'; render(); return; }
  if(!confirm('«'+c.name_kz+'» санатын жоюды растайсыз ба?')) return;
  loading = true; render();
  const { error } = await sb.from('categories').delete().eq('id', id);
  loading = false;
  if(error){ errorMsg = 'Жою қатесі: '+error.message; render(); return; }
  infoMsg = 'Жойылды.';
  await loadCategories();
  render();

// Admin never sees or sets a player's password directly -- that would
// require the service_role key, which must never be shipped to a
// static client-side page like this one (it bypasses every RLS
// policy in the database). Instead this sends Supabase's standard
// "reset your password" email; the player sets the new password
// themselves via that link.
async function sendPasswordReset(id){
  const p = players.find(x=>x.id===id);
  if(!p) return;
  if(!p.email){ errorMsg = 'Бұл ойыншының email мекенжайы белгісіз, сілтеме жіберу мүмкін емес.'; render(); return; }
  loading = true; render();
  const { error } = await sb.auth.resetPasswordForEmail(p.email);
  loading = false;
  if(error){ errorMsg = 'Жіберу қатесі: '+error.message; render(); return; }
  infoMsg = '«'+(p.name||'Ойыншы')+'» үшін құпия сөзді қалпына келтіру сілтемесі '+p.email+' мекенжайына жіберілді.';
  render();
}

function onFilePicked(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ errorMsg='Тек сурет файлын таңдаңыз.'; render(); return; }
  if(file.size > 8*1024*1024){ errorMsg='Файл тым үлкен (8 МБ дейін).'; render(); return; }
  pendingFile = file;
  errorMsg='';
  const reader = new FileReader();
  reader.onload = ()=>{ editing._preview = reader.result; render(); };
  reader.readAsDataURL(file);
}

async function saveItem(e){
  e.preventDefault();
  errorMsg=''; infoMsg='';
  const f = editing;
  f.name_kz = document.getElementById('f_name_kz').value.trim();
  f.name_ru = document.getElementById('f_name_ru').value.trim() || f.name_kz;
  f.city_kz = document.getElementById('f_city_kz').value.trim();
  f.city_ru = document.getElementById('f_city_ru').value.trim() || f.city_kz;
  f.fact_kz = document.getElementById('f_fact_kz').value.trim();
  f.fact_ru = document.getElementById('f_fact_ru').value.trim() || f.fact_kz;
  f.category_id = document.getElementById('f_category').value;
  f.pair_key = document.getElementById('f_pair_key').value.trim() || null;
  f.sort_order = parseInt(document.getElementById('f_sort').value,10) || 0;

  if(!f.name_kz || !f.city_kz || !f.fact_kz){
    errorMsg = 'Атауын, қосымша белгісін және сипаттамасын (кемінде қазақша) толтырыңыз.';
    render(); return;
  }
  if(!f.category_id){
    errorMsg = 'Санатты таңдаңыз.';
    render(); return;
  }
  if(!pendingFile && !f.image_url){
    errorMsg = 'Суретін жүктеңіз.';
    render(); return;
  }

  loading = true; render();
  try{
    if(pendingFile){
      const ext = (pendingFile.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
      const path = (crypto.randomUUID?crypto.randomUUID():String(Date.now()))+'.'+ext;
      const { error: upErr } = await sb.storage.from(BUCKET).upload(path, pendingFile, { upsert:false, contentType: pendingFile.type });
      if(upErr) throw upErr;
      const { data: pub } = sb.storage.from(BUCKET).getPublicUrl(path);
      f.image_url = pub.publicUrl;
    }
    const row = {
      name_kz:f.name_kz, name_ru:f.name_ru, city_kz:f.city_kz, city_ru:f.city_ru,
      fact_kz:f.fact_kz, fact_ru:f.fact_ru, image_url:f.image_url, category_id:f.category_id,
      pair_key:f.pair_key, sort_order:f.sort_order
    };
    if(f.id){
      const { error } = await sb.from('game_items').update(row).eq('id', f.id);
      if(error) throw error;
      infoMsg = 'Сақталды.';
    } else {
      const { error } = await sb.from('game_items').insert(row);
      if(error) throw error;
      infoMsg = 'Қосылды.';
    }
    editing = null; pendingFile = null;
    await loadItems();
  }catch(err){
    errorMsg = 'Сақтау қатесі: '+(err.message||err);
    loading = false; render();
  }
}

async function importBuiltins(){
  if(importing) return;
  const mosquesCat = categories.find(c=>c.key==='kzMosques' || c.key==='mosques');
  if(!mosquesCat){
    errorMsg = '«Қазақстан мешіттері» санаты табылмады. Алдымен supabase/categories.sql және p10_categories_match_site.sql орындалғанын тексеріңіз.';
    render(); return;
  }
  importing = true; errorMsg=''; infoMsg=''; importProgress='Басталды…';
  render();
  let added = 0, skipped = 0;
  for(let i=0;i<BUILTIN_MOSQUES.length;i++){
    const b = BUILTIN_MOSQUES[i];
    importProgress = (i+1)+'/'+BUILTIN_MOSQUES.length+': '+b.name_kz;
    render();
    const already = items.some(m=>m.name_kz===b.name_kz && m.city_kz===b.city_kz);
    if(already){ skipped++; continue; }
    try{
      const resp = await fetch(BUILTIN_BASE + b.id + '.jpg');
      if(!resp.ok) throw new Error('сурет жүктелмеді (HTTP '+resp.status+')');
      const blob = await resp.blob();
      const path = b.id + '-' + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())) + '.jpg';
      const { error: upErr } = await sb.storage.from(BUCKET).upload(path, blob, { upsert:false, contentType:'image/jpeg' });
      if(upErr) throw upErr;
      const { data: pub } = sb.storage.from(BUCKET).getPublicUrl(path);
      const { error: insErr } = await sb.from('game_items').insert({
        name_kz:b.name_kz, name_ru:b.name_ru, city_kz:b.city_kz, city_ru:b.city_ru,
        fact_kz:b.fact_kz, fact_ru:b.fact_ru, image_url:pub.publicUrl,
        category_id:mosquesCat.id, sort_order:i
      });
      if(insErr) throw insErr;
      added++;
    }catch(e){
      importing = false; importProgress='';
      errorMsg = 'Импорт қатесі ('+b.name_kz+'): '+(e.message||e);
      await loadItems();
      return;
    }
  }
  importing = false; importProgress='';
  infoMsg = added+' мешіт қосылды'+(skipped ? ', '+skipped+' бұрын қосылған болатын' : '')+'.';
  await loadItems();
}

      <div class="thumb-9x16" style="background-image:url('${esc(m.image_url)}')"></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.name_kz)}</div>
        <div style="font-size:12px;color:var(--mut);margin-top:2px">${esc(m.city_kz)}</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="startEditById('${m.id}')">Өңдеу</button>
      <button class="btn btn-danger btn-sm" onclick="deleteItemById('${m.id}')">Жою</button>
    </div>`).join('');

  const catPills = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
    <button class="btn btn-sm" onclick="selectCategoryFilter(null)" style="background:${activeCategoryId?'var(--paper)':'#0E3B2E'};color:${activeCategoryId?'var(--g8)':'#fff'};border:1px solid var(--line)">Барлығы</button>
    ${categories.map(c=>`<button class="btn btn-sm" onclick="selectCategoryFilter('${c.id}')" style="background:${activeCategoryId===c.id?'#0E3B2E':'var(--paper)'};color:${activeCategoryId===c.id?'#fff':'var(--g8)'};border:1px solid var(--line)">${esc(c.name_kz)}</button>`).join('')}
  </div>`;

  return `
  ${editing ? renderForm() : `${catPills}
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">
    <button class="btn btn-primary" onclick="startNew()" ${categories.length?'':'disabled'}>+ Сурет қосу</button>
    <button class="btn btn-ghost" onclick="importBuiltins()" ${importing?'disabled':''}>
      ${importing ? '<span class="spinner spinner-dark"></span>&nbsp; '+esc(importProgress) : 'Сайттағы 14 мешітті импорттау'}
    </button>
  </div>`}

  <div class="card">
    ${loading && !items.length ? `<div style="padding:24px;text-align:center;color:var(--mut)">Жүктелуде…</div>` :
      (!editing && filtered.length===0) ? `<div style="padding:24px;text-align:center;color:var(--mut)">Әзірге бұл санатта ештеңе жоқ.</div>` :
      (!editing ? rows : '')}
  </div>`;
}

function selectCategoryFilter(id){
  activeCategoryId = id || null;
  render();
}

const PAGE_TITLE = { items:'Суреттер', categories:'Санаттар', avatars:'Аватарлар', players:'Ойыншылар' };

function renderDashboard(){
  const body = activeTab==='avatars' ? renderAvatarsDashboard()
    : activeTab==='categories' ? renderCategoriesPage()
    : activeTab==='players' ? renderPlayersPage()
    : renderItemsPage();
  return `<div class="shell">
    ${renderSidebar()}
    <div class="main">
      <div class="pagehead"><h2>${esc(PAGE_TITLE[activeTab])}</h2></div>
      <div class="content">
        ${errorMsg?`<div class="err">${esc(errorMsg)}</div>`:''}
        ${infoMsg?`<div class="msg">${esc(infoMsg)}</div>`:''}
        ${body}
      </div>
    </div>
  </div>`;
}

function render(){
  if(!session){ app.innerHTML = renderLogin(); return; }
  app.innerHTML = renderDashboard();
}

init();
</script>
</body>
</html>
